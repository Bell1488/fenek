# Укажите SSL-сертификат Sirokko.pro перед включением этого конфига.
server {
    listen 80;
    server_name sirokko.pro www.sirokko.pro;
    return 301 https://sirokko.pro$request_uri;
}
server {
    listen 443 ssl;
    server_name www.sirokko.pro;
    ssl_certificate /etc/letsencrypt/live/sirokko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sirokko.pro/privkey.pem;
    return 301 https://sirokko.pro$request_uri;
}
server {
    listen 443 ssl;
    server_name sirokko.pro;
    ssl_certificate /etc/letsencrypt/live/sirokko.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sirokko.pro/privkey.pem;
    client_max_body_size 32k;
    # Не записываем URL с рекламными и потенциально личными query-параметрами.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 40s;
    }
    location ~ /\. { deny all; }
}
